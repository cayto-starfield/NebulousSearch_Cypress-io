# This workflow will do a clean installation of node dependencies, cache/restore them,
# build the source code, and run tests across different versions of Node.js.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            node scripts/serve.js > /tmp/nebulous-search-server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid"' EXIT

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://localhost:8080/.github/workflows/Index.html >/dev/null; then
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/nebulous-search-server.log
                exit 1
              fi
              sleep 1
            done

            if ! curl --fail --silent http://localhost:8080/.github/workflows/Index.html >/dev/null; then
              cat /tmp/nebulous-search-server.log
              exit 1
            fi

            npm test
